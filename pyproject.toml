[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-pasar"
version = "0.3.0"
description = "Dashboard riset kompetitor, pasar, dan harga untuk produk digital dan AI agent Impost Teknologi Indonesia."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "altair>=5.4,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Data seed berisi teks panjang dari halaman sumber; biarkan satu baris per baris.
"scripts/seed_data.py" = ["E501"]
